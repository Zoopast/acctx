name: Publish to npm

# Runs when a GitHub release is published. The release tag must be
# v<version> and match package.json, and the full suite must pass first.
# Authentication is npm Trusted Publishing (OIDC); there is no token.
# The version is STAGED, not published: approve it on npmjs.com
# (Staged Packages tab) or with `npm stage approve <stage-id>`.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the release tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match package.json ($pkg)"; exit 1
          fi
      - run: pnpm test
      - name: Use an npm that supports trusted publishing and staging
        run: npm install -g npm@latest && npm --version
      - run: npm stage publish --provenance --access public
